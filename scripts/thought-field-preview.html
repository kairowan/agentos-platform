<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>AgentOS production thought-field shader</title>
  <style>
    html, body, canvas { width: 100%; height: 100%; margin: 0; display: block; background: #020609; }
    #error { position: fixed; inset: 16px; color: #ff8b82; white-space: pre-wrap; font: 14px monospace; }
  </style>
</head>
<body>
<canvas id="stage" width="944" height="2048"></canvas>
<pre id="error"></pre>
<script>
const vertexSource = `
  attribute vec2 aPosition;
  varying vec2 vUv;
  void main() {
    vUv = aPosition * 0.5 + 0.5;
    gl_Position = vec4(aPosition, 0.0, 1.0);
  }
`;

function compile(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

async function main() {
  const canvas = document.querySelector('#stage');
  const gl = canvas.getContext('webgl', { antialias: false, preserveDrawingBuffer: true });
  if (!gl) throw new Error('WebGL unavailable');
  const fragmentSource = await fetch('/apps/AgentShell/res/raw/thought_field_fragment.glsl').then(response => response.text());
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl, gl.VERTEX_SHADER, vertexSource));
  gl.attachShader(program, compile(gl, gl.FRAGMENT_SHADER, fragmentSource));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);

  const vertices = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vertices);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const position = gl.getAttribLocation(program, 'aPosition');
  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

  const uniform1f = (name, value) => gl.uniform1f(gl.getUniformLocation(program, name), value);
  const uniform2f = (name, x, y) => gl.uniform2f(gl.getUniformLocation(program, name), x, y);
  const uniform4f = (name, x, y, z, w) => gl.uniform4f(gl.getUniformLocation(program, name), x, y, z, w);
  uniform2f('uResolution', canvas.width, canvas.height);
  uniform1f('uTime', Number(new URLSearchParams(location.search).get('time') || 12.5));
  uniform1f('uYaw', -12);
  uniform1f('uZoom', 5.3);
  uniform1f('uMood', 6);
  uniform1f('uGesture', 5);
  uniform1f('uIntensity', 0.72);
  uniform2f('uGaze', 0.08, 0.02);
  uniform4f('uShape', 0.5, 0.55, 0.5, 0.55);
  uniform2f('uFieldShape', 0.5, 0.5);
  uniform4f('uExpression', 1, 0.5, 0.96, 0.45);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  document.title = 'READY';
}

main().catch(error => {
  document.querySelector('#error').textContent = error.stack || String(error);
  document.title = 'ERROR';
});
</script>
</body>
</html>
