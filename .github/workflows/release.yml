name: Release APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.12"
      - name: Test and build tagged APK
        run: |
          ./tests/check.sh
          python3 tests/check_preview_tools.py
          gradle --no-daemon testDebugUnitTest assembleDebug
          python3 scripts/package-preview.py
      - name: Create checksum
        run: |
          cp services/AgentCapabilityService/build/outputs/apk/debug/AgentCapabilityService-debug.apk .
          cp services/AgentMediaService/build/outputs/apk/debug/AgentMediaService-debug.apk .
          cp apps/AgentShell/build/outputs/apk/debug/AgentShell-debug.apk .
          sha256sum AgentCapabilityService-debug.apk AgentMediaService-debug.apk AgentShell-debug.apk > AgentOS-debug-apks.sha256
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --generate-notes \
            --title "AgentOS $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" \
            AgentCapabilityService-debug.apk \
            AgentMediaService-debug.apk \
            AgentShell-debug.apk \
            AgentOS-debug-apks.sha256 \
            artifacts/AgentOS-*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
