name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.12"
      - name: Validate repository
        run: ./tests/check.sh
      - name: Test and build APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug :apps:AgentShell:assembleDebugAndroidTest
      - name: Check preview tooling and package matching APKs
        run: |
          python3 tests/check_preview_tools.py
          python3 scripts/package-preview.py
      - uses: actions/upload-artifact@v7
        with:
          name: AgentOS-debug-apks
          path: |
            apps/AgentShell/build/outputs/apk/debug/AgentShell-debug.apk
            services/AgentCapabilityService/build/outputs/apk/debug/AgentCapabilityService-debug.apk
            services/AgentMediaService/build/outputs/apk/debug/AgentMediaService-debug.apk
            apps/AgentShell/build/outputs/apk/androidTest/debug/AgentShell-debug-androidTest.apk
            artifacts/AgentOS-*.zip
          if-no-files-found: error
