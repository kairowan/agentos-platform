name: Verify Developer Preview

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Revision to build and record together (must contain preview scripts)
        required: true
        default: main

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_AVD_HOME: /tmp/agentos-avd
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.12"
      - name: Build and package one revision
        run: |
          gradle --no-daemon testDebugUnitTest assembleDebug :apps:AgentShell:assembleDebugAndroidTest
          python3 tests/check_preview_tools.py
          python3 scripts/package-preview.py
      - name: Create disposable Android virtual device
        run: |
          sdkmanager "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name agentos-demo \
            --package "system-images;android-35;google_apis;x86_64" --device pixel_6
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Verify installed components and record the offline flow
        run: |
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd agentos-demo -port 5554 \
            -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
            >artifacts/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          timeout 180 adb -s emulator-5554 wait-for-device
          for attempt in $(seq 1 60); do
            if [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then break; fi
            sleep 3
          done
          test "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = "1"
          bundle=$(python3 -c 'from pathlib import Path; print(next(p.parent for p in Path("artifacts").glob("AgentOS-*/manifest.json")))')
          python3 scripts/preview-device.py install --bundle "$bundle" \
            --serial emulator-5554 --state artifacts/original-defaults.json
          adb -s emulator-5554 install -r apps/AgentShell/build/outputs/apk/androidTest/debug/AgentShell-debug-androidTest.apk
          adb -s emulator-5554 shell am instrument -w \
            com.agentos.shell.test/com.agentos.shell.PreviewInstrumentation | tee artifacts/room-check.txt
          grep -q '^PASS: Room' artifacts/room-check.txt
          adb -s emulator-5554 shell settings put system screen_off_timeout 600000
          adb -s emulator-5554 shell input keyevent 82
          adb -s emulator-5554 shell wm size 720x1280
          adb -s emulator-5554 shell wm density 280
          # Explicit grants apply only to this disposable CI emulator.
          adb -s emulator-5554 shell cmd role add-role-holder --user 0 android.app.role.DIALER com.agentos.capability 0
          adb -s emulator-5554 shell cmd role add-role-holder --user 0 android.app.role.SMS com.agentos.capability 0
          adb -s emulator-5554 shell pm grant com.agentos.capability android.permission.READ_PHONE_STATE
          adb -s emulator-5554 shell pm grant com.agentos.capability android.permission.CALL_PHONE
          adb -s emulator-5554 shell pm grant com.agentos.capability android.permission.POST_NOTIFICATIONS
          python3 scripts/capture-preview.py --serial emulator-5554 --check-communications
      # Approved public output: packages and written results only, no runtime media.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: AgentOS-component-preview-${{ github.run_id }}
          path: |
            artifacts/AgentOS-*.zip
            artifacts/preview-recording/verification.json
            artifacts/room-check.txt
            artifacts/emulator.log
          if-no-files-found: warn
