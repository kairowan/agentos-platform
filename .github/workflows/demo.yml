name: Capture Demo

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose APK and screenshot should be reproduced
        required: true
        default: v0.4.0

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_AVD_HOME: /tmp/agentos-avd
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.12"
      - name: Build APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Create Android virtual device
        run: |
          sdkmanager "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd \
            --force \
            --name agentos-demo \
            --package "system-images;android-35;google_apis;x86_64" \
            --device pixel_6
          "$ANDROID_SDK_ROOT/emulator/emulator" -list-avds | grep -Fx agentos-demo
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Capture real shell screenshot
        run: |
          "$ANDROID_SDK_ROOT/emulator/emulator" \
            -avd agentos-demo \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            >/tmp/agentos-emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          if ! timeout 180 adb wait-for-device; then
            cat /tmp/agentos-emulator.log
            exit 1
          fi
          for attempt in $(seq 1 60); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            sleep 3
          done
          if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; then
            cat /tmp/agentos-emulator.log
            exit 1
          fi
          adb install -r services/AgentCapabilityService/build/outputs/apk/debug/AgentCapabilityService-debug.apk
          adb install -r apps/AgentShell/build/outputs/apk/debug/AgentShell-debug.apk
          adb shell input keyevent 82
          adb shell am start -W -n com.agentos.shell/.MainActivity
          sleep 3
          adb shell uiautomator dump /sdcard/agentos-before.xml
          adb pull /sdcard/agentos-before.xml /tmp/agentos-before.xml
          grep -q 'text="语音智能体"' /tmp/agentos-before.xml
          grep -q 'text="消息事件"' /tmp/agentos-before.xml
          tap_coordinates=$(python3 -c 'import re,sys,xml.etree.ElementTree as ET; node=next(n for n in ET.parse(sys.argv[1]).iter("node") if n.get("text") == "查看当前时间"); x1,y1,x2,y2=map(int,re.findall(r"\d+",node.get("bounds"))); print((x1+x2)//2,(y1+y2)//2)' /tmp/agentos-before.xml)
          adb shell input tap $tap_coordinates
          for attempt in $(seq 1 10); do
            sleep 1
            adb shell uiautomator dump /sdcard/agentos-window.xml
            adb pull /sdcard/agentos-window.xml /tmp/agentos-window.xml
            if grep -q 'text="本地时间"' /tmp/agentos-window.xml; then break; fi
          done
          python3 -c 'import sys,xml.etree.ElementTree as ET; print("UI text:", " | ".join(filter(None,(n.get("text") for n in ET.parse(sys.argv[1]).iter("node")))))' /tmp/agentos-window.xml
          mkdir -p demo
          adb exec-out screencap -p > demo/AgentShell-home.png
          grep -q 'text="本地时间"' /tmp/agentos-window.xml
          grep -q 'system.time.read 通过 Capability Broker 提供' /tmp/agentos-window.xml
          shell_uid=$(adb shell pm list packages -U com.agentos.shell | sed -n 's/.*uid:\([0-9]*\).*/\1/p' | tr -d '\r')
          service_uid=$(adb shell pm list packages -U com.agentos.capability | sed -n 's/.*uid:\([0-9]*\).*/\1/p' | tr -d '\r')
          echo "Shell UID: $shell_uid; Capability Service UID: $service_uid"
          test -n "$shell_uid"
          test -n "$service_uid"
          test "$shell_uid" != "$service_uid"
          test -n "$(adb shell pidof com.agentos.capability | tr -d '\r')"
          file demo/AgentShell-home.png | grep -q 'PNG image data'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: AgentShell-demo
          path: |
            demo/AgentShell-home.png
            /tmp/agentos-before.xml
            /tmp/agentos-window.xml
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: AgentShell-emulator-log
          path: /tmp/agentos-emulator.log
          if-no-files-found: warn
      - name: Attach screenshot to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" demo/AgentShell-home.png --clobber
